

name: Ready
# This workflow is triggered by 'ready' branches 

on:
  workflow_dispatch:
  push:
    branches: 
      - 'ready/*'
      
jobs:

  mark-pending:
    name: Pending
    permissions:
      statuses: write
      contents: read
    uses: lakruzz/workflows/.github/workflows/mark_pending.yml@experimental
    with:
      statuses: |
        cspell:check
        jekyll:build
        proofer:check_external
        markdown:lint

  cspell-check:
    name: Check
    needs: mark-pending
    permissions:
      statuses: write
      contents: read
    uses: lakruzz/workflows/.github/workflows/cspell_check.yml@experimental
    with:
      context: cspell:check
      config_file: cspell.json 

  markdown-linter:
    name: Linting
    needs: mark-pending
    permissions:
      statuses: write
      contents: read
    uses: lakruzz/workflows/.github/workflows/markdown_linter.yml@experimental
    with:
      context: markdown:lint
      config_file: .markdownlint-cli2.jsonc

  prepare-image:
    name: Fetch or Build
    permissions:
      packages: write
    uses: lakruzz/workflows/.github/workflows/docker_with_cache.yml@experimental
    with:
      dockerfile: dockerfile
      hash-files: Gemfile.lock
      image-tag: docker-workflow-image

  proofer:
    name: proofer
    needs: [mark-pending, prepare-image]
    permissions:
      statuses: write
      contents: read
      packages: read
      actions: write
    uses: lakruzz/workflows/.github/workflows/rake_task.yml@experimental
    with:
      rake-task: jekyll:build proofer:check_external
      image-fqdn: ${{ needs.prepare-image.outputs.image-fqdn }}      

  jekyll-build:
    name: Jekyll Build
    needs: 
      - prepare-image
      - mark-pending
      - cspell-check
      - markdown-linter
    permissions:
      statuses: write
      contents: read
      packages: read
      actions: write
    uses: lakruzz/workflows/.github/workflows/rake_task.yml@experimental
    secrets:
      token: ${{ secrets.READY_PUSHER }}
    with:
      rake-task: jekyll:build
      image-fqdn: ${{ needs.prepare-image.outputs.image-fqdn }}
      upload-artifact: true      

          
  merge-to-trunk:
    name: Merge to trunk
    runs-on: ubuntu-latest
    needs: 
      - jekyll-build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      # Not sue what goes on here? Whre did the secret come from?
      # check *./docs/ready-pusher.md' for more details on how to set up and use this workflow
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full history to ensure we can merge and push
          token: ${{ secrets.READY_PUSHER }} # PAT with content:write (can not use secrets.GITHUB_TOKEN as it is a special case, it does not trigger other workflows on push)

      - uses: devx-cafe/takt-actions/ready-to-trunk@v1
        # with: #Uncomment if you want to override any of the default inputs
        # target_branch: #default is main
        # user_name: #default is "Ready Pusher Bot"
        # user_email: #default is "ready-pusher@${{ github.repository_owner }}.github.com"
        # delete_dev_branch: false # default is true
        # delete_ready_branch: false # default is true
        # close_pr: false # default is true
        # close_issue: false # default is true
  